[build]
  publish = "."

# Always serve the newest data so every visitor sees updates quickly
[[headers]]
  for = "/*.xlsx"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
